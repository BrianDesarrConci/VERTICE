<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f08" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="VÉRTICE — Merchandising premium. Camisetas, hoodies, libretas y totebags estampados con calidad. Diseño que deja huella."
    />
    <title>VÉRTICE — Merchandising premium</title>
    <!-- Anti-FOUC: aplica el tema antes de pintar. Por defecto MODO OSCURO;
         solo usa claro si el usuario lo eligió explícitamente (guardado por Zustand). -->
    <script>
      (function () {
        var theme = 'dark'; // default de la marca
        try {
          var raw = localStorage.getItem('vertice-theme');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.theme) theme = parsed.state.theme;
          }
        } catch (e) {}
        if (theme !== 'light') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
