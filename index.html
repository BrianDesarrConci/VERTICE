<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="VÉRTICE — Merchandising premium. Camisetas, hoodies, libretas y totebags estampados con calidad. Diseño que deja huella."
    />
    <title>VÉRTICE — Merchandising premium</title>
    <!-- Anti-FOUC: aplica el tema antes de pintar para evitar parpadeo en modo oscuro -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vertice-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored ? stored === 'dark' : prefersDark;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
